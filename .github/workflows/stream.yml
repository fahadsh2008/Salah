name: Kick 24/7 Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download Videos from Release
        run: |
          mkdir -p videos
          for i in $(seq 1 22); do
            curl -f -L -o "videos/${i}.mp4" "https://github.com/fahadsh2008/Salah/releases/download/v1.0/${i}.mp4" || true
          done

      - name: Stream to Kick
        env:
          KICK_URL: ${{ secrets.KICK_STREAM_URL }}
        run: |
          while true; do
            for i in $(seq 1 22); do
              if [ -f "videos/${i}.mp4" ]; then
                ffmpeg -re -i "videos/${i}.mp4" -c:v libx264 -preset veryfast -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 -f flv "$KICK_URL"
              fi
            done
          done
