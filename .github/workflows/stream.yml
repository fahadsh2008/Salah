name: Kick 24/7 Stream

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: "رقم الفيديو الذي يبدأ منه البث (1 إلى 22)"
        required: false
        default: "1"
        type: string
  schedule:
    - cron: "0 */6 * * *"

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg, Stunnel, Fonts, and GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y ffmpeg stunnel4 gh fonts-noto fonts-noto-core fonts-dejavu-core

      - name: Download Videos from Release
        run: |
          mkdir -p videos
          for i in $(seq 1 22); do
            curl -f -L -o "videos/${i}.mp4" "https://github.com/fahadsh2008/Salah/releases/download/v1.0/${i}.mp4" || true
          done

      - name: Setup Stunnel & Stream to Kick
        env:
          KICK_URL: ${{ secrets.KICK_STREAM_URL }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          START_INDEX_RAW: ${{ inputs.start_index }}
        run: |
          CLEAN_URL="${KICK_URL#rtmps://}"
          HOST="${CLEAN_URL%%/*}"
          STREAM_KEY="${CLEAN_URL#*/}"
          WORK_DIR="$(pwd)"

          cat <<EOF > "${WORK_DIR}/stunnel.conf"
          foreground = no
          debug = warning
          output = ${WORK_DIR}/stunnel.log

          [kick]
          client = yes
          verify = 0
          sni = ${HOST}
          accept = 127.0.0.1:1935
          connect = ${HOST}:443
          EOF

          stunnel4 "${WORK_DIR}/stunnel.conf"
          sleep 2

          START_INDEX="${START_INDEX_RAW:-1}"
          if ! [[ "${START_INDEX}" =~ ^[0-9]+$ ]] || [ "${START_INDEX}" -lt 1 ] || [ "${START_INDEX}" -gt 22 ]; then
            START_INDEX=1
          fi

          FONT_FILE=""
          for candidate in \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf" \
            "/usr/share/fonts/truetype/noto/NotoSans-Regular.ttf" \
            "/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf"; do
            if [ -s "$candidate" ]; then
              FONT_FILE="$candidate"
              break
            fi
          done
          echo "Selected font: ${FONT_FILE}"

          TICKER_TEXT="صفة الوضوء من بداية الطهارة حتى نهايتها والصلاة من التكبير حتى التسليم   -   Complete Wudu and Salah from Takbir to Taslim   -   Woudou et Salat complets   -   Tata cara wudu dan shalat lengkap   -   Wudu e Oracao completos   -   Описание вуду и намаза от такбира до таслима"
          SAFE_TEXT="${TICKER_TEXT//\'/}"
          SAFE_TEXT="${SAFE_TEXT//:/ }"
          SAFE_TEXT="${SAFE_TEXT//,/ }"

          MAX_SECONDS=20700
          START_TIME=$(date +%s)
          FFMPEG_PID=""
          NEXT_VIDEO="${START_INDEX}"

          cleanup() {
            if [ -n "${FFMPEG_PID}" ] && kill -0 "${FFMPEG_PID}" 2>/dev/null; then
              kill -TERM "${FFMPEG_PID}" 2>/dev/null || true
              wait "${FFMPEG_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          CURRENT="${START_INDEX}"
          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))
            if [ "${ELAPSED}" -ge "${MAX_SECONDS}" ]; then
              break
            fi

            FILE="${WORK_DIR}/videos/${CURRENT}.mp4"
            if [ -s "$FILE" ]; then
              if [ "${CURRENT}" -ge 22 ]; then
                NEXT_VIDEO=1
              else
                NEXT_VIDEO=$((CURRENT + 1))
              fi

              echo "Playing video ${CURRENT}.mp4 (Next session start: ${NEXT_VIDEO})"

              ffmpeg -re -i "$FILE" \
                -filter_complex "[0:v]drawbox=x=0:y=h-62:w=iw:h=62:color=navy@0.92:t=fill,drawtext=fontfile=${FONT_FILE}:text=${SAFE_TEXT}:fontcolor=yellow:borderw=2:bordercolor=black:fontsize=25:y=h-42:x=w-mod(t*120\,w+tw)[v]" \
                -map "[v]" -map "0:a?" \
                -r 25 -c:v libx264 -preset ultrafast -b:v 1800k -maxrate 2200k -bufsize 4400k \
                -pix_fmt yuv420p -g 50 -keyint_min 50 -sc_threshold 0 \
                -c:a aac -b:a 128k -ar 44100 -ac 2 \
                -f flv "rtmp://127.0.0.1:1935/app/${STREAM_KEY}" &
              FFMPEG_PID=$!
              wait "${FFMPEG_PID}" || true
              FFMPEG_PID=""
              sleep 2
            fi

            if [ "${CURRENT}" -ge 22 ]; then
              CURRENT=1
            else
              CURRENT=$((CURRENT + 1))
            fi
          done

          cleanup
          echo "Starting next session from video ${NEXT_VIDEO}..."
          gh workflow run "Kick 24/7 Stream" \
            --repo "${GITHUB_REPOSITORY}" \
            -f start_index="${NEXT_VIDEO}" || true
